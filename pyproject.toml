[project]
name = "wherewasi"
version = "0.1.0"
requires-python = ">=3.10"
authors= [ {"name"="Laween Al-Sulaivany", "email"="laweenhamza@gmail.com"},]
description = "A tiny CLI tool that remembers where you left off."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "click>=8.5.0",
    "rich>=15.0.0",
    "click-default-group>=1.2.4",
    "platformdirs>=4.11.12",
]

[project.urls]
Homepage = "https://github.com/laween-alsulaivany/wherewasi"
Repository = "https://github.com/laween-alsulaivany/wherewasi"

[project.scripts]
wherewasi = "wherewasi.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wherewasi"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
